[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
    "venv",
    "staticfiles",
    "**/migrations",
    "scratch",
    "mockups",
]

[tool.ruff.lint]
# Start conservative: catch real bugs (F), basic style (E/W), and import issues (I).
# Add B (flake8-bugbear) and DJ (django) once the codebase is clean.
select = ["E", "F", "W", "I"]
# E501 (line too long): line-length above already enforces this; let formatter handle wrap.
# E402 (module-level import not at top): config/settings.py has runtime-conditional imports.
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]   # test fixtures often look unused / re-import
"conftest.py" = ["F401"]
