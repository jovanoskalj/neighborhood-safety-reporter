{% load static %}
<!DOCTYPE html>
<html lang="mk-MK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Безбедно Соседство{% endblock %}</title>
    <style>
        :root { --navy: #1a2238; --green: #2ecc71; --gray-bg: #f8f9fb; }
        body { font-family: 'Segoe UI', Arial; margin: 0; background: var(--gray-bg); color: #333; }
        
        .navbar { background: var(--navy); color: white; padding: 20px 10%; display: flex; justify-content: space-between; align-items: center; }
        .nav-links a { color: rgba(255,255,255,0.7); text-decoration: none; margin-left: 25px; font-size: 14px; }
        
        .footer { background: var(--navy); color: rgba(255,255,255,0.5); padding: 40px 10%; display: flex; justify-content: space-between; font-size: 13px; margin-top: 60px; }
        
        .container { min-height: 80vh; padding-bottom: 50px; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div><strong>Безбедно Соседство</strong><br><small style="opacity:0.6">Република Северна Македонија</small></div>
        <div class="nav-links">
            <a href="{% url 'home' %}">Дома</a>
            <a href="#">Најава</a>
            <a href="#">Регистрација</a>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="footer">
        <div>© 2026 Безбедно Соседство · Сите права задржани</div>
        <div>safetyreport.mk@gmail.com · +389 2 223 456</div>
    </footer>
</body>
</html>
