{% extends 'base.html' %}

{% block title %}Верификација успешна{% endblock %}

{% block content %}
<style>
  :root {
    --success-green: #10B981;
    --primary-blue: #1A2238;
    --primary-gradient: linear-gradient(135deg, #1A2238 0%, #2d3f66 100%);
    --glass-bg: rgba(255, 255, 255, 0.9);
  }

  body {
    background-color: #f4f7ff;
    background-image: 
        radial-gradient(at 50% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
    font-family: 'Inter', sans-serif;
  }

  .success-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 35px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.05);
    padding: 4rem 2rem;
    text-align: center;
  }

  /* Success Checkmark Animation */
  .checkmark-wrapper {
    width: 100px;
    height: 100px;
    background: #ecfdf5;
    color: var(--success-green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 2rem;
    font-size: 50px;
    position: relative;
    animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }

  .checkmark-wrapper::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid var(--success-green);
    animation: pulse 2s infinite;
  }

  @keyframes scaleIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  @keyframes pulse {
    0% { transform: scale(1); opacity: 0.5; }
    100% { transform: scale(1.5); opacity: 0; }
  }

  .success-card h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    color: #0F172A;
    font-size: 28px;
    margin-bottom: 1rem;
  }

  .success-text {
    color: #64748B;
    font-size: 16px;
    margin-bottom: 2.5rem;
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
  }

  .btn-login {
    background: var(--primary-gradient);
    color: white;
    border: none;
    border-radius: 16px;
    padding: 1rem 3rem;
    font-weight: 700;
    font-size: 16px;
    transition: all 0.3s;
    text-decoration: none;
    display: inline-block;
  }

  .btn-login:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 30px rgba(26, 34, 56, 0.25);
    filter: brightness(1.05);
    color: white;
  }

  /* Confetti-like background accents */
  .dot {
    position: absolute;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    z-index: -1;
  }
</style>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-md-8 col-lg-5 col-xl-4">
        <div class="card success-card border-0">
            <div class="checkmark-wrapper">
                <i class="bi bi-check-lg"></i>
            </div>
            
            <h1>Успешно!</h1>
            <p class="success-text">
                Вашиот е-маил е успешно верификуван. Сега можете да продолжите до вашиот профил.
            </p>

            <a href="{% url 'login' %}" class="btn btn-login">
                Оди на најава
            </a>
        </div>
    </div>
</div>
{% endblock %}
