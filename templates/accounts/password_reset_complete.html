{% extends 'base.html' %}

{% block title %}Лозинката е променета{% endblock %}

{% block content %}
<style>
    :root {
        --primary-blue: #1A2238;
        --light-blue: #2a3b5f;
        --primary-gradient: linear-gradient(135deg, #1A2238 0%, #2d3f66 100%);
        --glass-bg: rgba(255, 255, 255, 0.85);
    }

    body {
        background-color: #f4f7ff;
        background-image:
                radial-gradient(at 0% 0%, rgba(26, 34, 56, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(45, 63, 102, 0.12) 0px, transparent 50%);
        font-family: 'Inter', sans-serif;
        overflow-x: hidden;
    }

    .bg-shape {
        position: absolute;
        border-radius: 50%;
        filter: blur(100px);
        z-index: -1;
        opacity: 0.5;
    }

    .shape-1 { width: 420px; height: 420px; background: #1A2238; top: -160px; left: -120px; }
    .shape-2 { width: 360px; height: 360px; background: #2a3b5f; bottom: -120px; right: -60px; }

    .done-card {
        background: var(--glass-bg);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 20px 40px rgba(0, 41, 133, 0.08);
        padding: 3rem 2.5rem;
        transition: all 0.35s ease;
    }

    .done-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 30px 60px rgba(0, 41, 133, 0.12);
    }

    .done-card h1 {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        color: #0F172A;
        font-size: 30px;
        margin-bottom: 0.25rem;
    }

    .subtitle {
        color: #64748B;
        font-size: 15px;
        margin-bottom: 2rem;
    }

    .btn-primary {
        background: var(--primary-gradient);
        border: none;
        border-radius: 14px;
        padding: 0.8rem 1.2rem;
        font-weight: 700;
        font-size: 15px;
        transition: all 0.3s;
        color: #fff;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .btn-primary:hover {
        filter: brightness(1.05);
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(26, 34, 56, 0.25);
        color: #fff;
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .animate-card {
        animation: slideUp 0.7s cubic-bezier(0.23, 1, 0.32, 1) forwards;
    }
</style>

<div class="bg-shape shape-1"></div>
<div class="bg-shape shape-2"></div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="col-12 col-md-7 col-lg-5 col-xl-4 animate-card">
                <div class="card done-card border-0">
                        <div class="card-body p-0 text-center">
                                <h1>Лозинката е успешно променета</h1>
                                <p class="subtitle">Сега можете да се најавите со новата лозинка.</p>
                                <a href="{% url 'login' %}" class="btn-primary">
                                        <i class="bi bi-box-arrow-in-right"></i>
                                        Најави се
                                </a>
                        </div>
                </div>
        </div>
</div>
{% endblock %}
