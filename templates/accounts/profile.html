{% extends 'base.html' %}

{% block title %}Профил{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-3">Профил</h1>
                <p class="text-muted">Корисник: <strong>{{ request.user.username }}</strong></p>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label" for="phone">Телефон</label>
                        <input class="form-control" id="phone" name="phone" value="{{ profile.phone }}">
                    </div>
                    {% if profile.role == 'officer' %}
                    <div class="mb-3">
                        <label class="form-label" for="sector">Сектор</label>
                        <select class="form-select" id="sector" name="sector">
                            {% for value, label in sector_choices %}
                            <option value="{{ value }}" {% if profile.sector == value %}selected{% endif %}>{{ label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    {% endif %}
                    <button class="btn btn-primary" type="submit">Зачувај</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
