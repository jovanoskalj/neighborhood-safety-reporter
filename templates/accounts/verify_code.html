{% extends 'base.html' %}

{% block title %}Верификација на е-маил{% endblock %}

{% block content %}
<style>
  :root {
    --primary-blue: #1A2238;
    --primary-gradient: linear-gradient(135deg, #1A2238 0%, #2d3f66 100%);
    --glass-bg: rgba(255, 255, 255, 0.85);
  }

  body {
    background-color: #f4f7ff;
    background-image: 
        radial-gradient(at 50% 0%, rgba(26, 34, 56, 0.1) 0px, transparent 50%);
    font-family: 'Inter', sans-serif;
  }

  /* Decorative Background Elements */
  .bg-shape {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    z-index: -1;
    opacity: 0.3;
  }
  .shape-center { width: 500px; height: 500px; background: #2a3b5f; top: 50%; left: 50%; transform: translate(-50%, -50%); }

  .verify-card {
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-radius: 32px;
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 25px 60px rgba(0, 41, 133, 0.1);
    padding: 3.5rem 2.5rem;
    text-align: center;
  }

  .icon-box {
    width: 80px;
    height: 80px;
    background: rgba(26, 34, 56, 0.1);
    color: var(--primary-blue);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 1.5rem;
    font-size: 32px;
  }

  .verify-card h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    color: #0F172A;
    font-size: 28px;
    margin-bottom: 1rem;
  }

  .email-display {
    background: #f1f5f9;
    padding: 4px 12px;
    border-radius: 8px;
    color: #1E293B;
    font-weight: 600;
    display: inline-block;
    margin-top: 5px;
  }

  .form-label {
    font-weight: 700;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #64748B;
    margin-bottom: 15px;
    display: block;
  }

  /* Large Code Input Styling */
  .code-input {
    font-size: 32px;
    font-weight: 800;
    letter-spacing: 12px;
    text-align: center;
    padding: 1rem;
    border-radius: 16px;
    border: 2px solid #E2E8F0;
    background: white;
    color: var(--primary-blue);
    transition: all 0.3s ease;
  }

  .code-input:focus {
    border-color: var(--primary-blue);
    box-shadow: 0 0 0 5px rgba(26, 34, 56, 0.12);
    outline: none;
    transform: scale(1.02);
  }

  .btn-verify {
    background: var(--primary-gradient);
    color: white;
    border: none;
    border-radius: 16px;
    padding: 1rem;
    font-weight: 700;
    font-size: 16px;
    margin-top: 1.5rem;
    transition: all 0.3s;
  }

  .btn-verify:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 24px rgba(26, 34, 56, 0.2);
    filter: brightness(1.05);
    color: white;
  }

  .resend-text {
    margin-top: 2rem;
    font-size: 14px;
    color: #64748B;
  }

  .resend-link {
    color: var(--primary-blue);
    text-decoration: none;
    font-weight: 700;
  }

  /* Simple Entrance Animation */
  @keyframes popIn {
    0% { opacity: 0; transform: scale(0.95); }
    100% { opacity: 1; transform: scale(1); }
  }

  .animate-pop {
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
  }
</style>

<div class="bg-shape shape-center"></div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-md-8 col-lg-5 col-xl-4 animate-pop">
        <div class="card verify-card border-0">
            <div class="icon-box">
                <i class="bi bi-shield-lock"></i>
            </div>
            
            <h1>Верификација</h1>
            <p class="text-muted mb-4">
                Внесете го кодот испратен на:<br>
                <span class="email-display">{{ email }}</span>
            </p>

            {% if error %}
                <div class="alert alert-danger border-0 rounded-4 mb-4" style="background: rgba(220, 38, 38, 0.1); color: #dc2626; font-size: 14px;">
                    <i class="bi bi-x-circle-fill me-2"></i>{{ error }}
                </div>
            {% endif %}

            <form method="post" novalidate>
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="code">6-цифрен код</label>
                    <input 
                        class="form-control code-input" 
                        id="code" 
                        name="code" 
                        maxlength="6" 
                        minlength="6" 
                        inputmode="numeric" 
                        pattern="[0-9]{6}" 
                        placeholder="000000"
                        required
                        autofocus
                    >
                </div>
                <div class="d-grid">
                    <button class="btn btn-verify" type="submit">Потврди код</button>
                </div>
            </form>

            <p class="resend-text">
                Не го добивте кодот? <br>
                <a href="#" class="resend-link">Испрати повторно</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
