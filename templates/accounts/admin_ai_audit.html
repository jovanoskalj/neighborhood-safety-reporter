{% extends "base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>AI Classification Audit Log</h2>
  <table class="table table-bordered table-sm">
    <thead>
      <tr><th>Time</th><th>Action</th><th>Report ID</th><th>Details</th></tr>
    </thead>
    <tbody>
      {% for log in logs %}
      <tr>
        <td>{{ log.timestamp }}</td>
        <td>{{ log.action }}</td>
        <td>{{ log.target_id }}</td>
        <td>{{ log.details }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
